# Local development stack for ShramaSiri (`npx supabase start`).
# Ports are offset (554xx) so this stack can run next to other local
# Supabase projects. Production settings are configured in the Supabase
# dashboard; see docs/SUPABASE_SETUP.md.
project_id = "shramasiri"

[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55422
shadow_port = 55420
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false

[inbucket]
enabled = true
port = 55424

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
# Local only: skip confirmation so tests can sign in immediately.
# Keep confirmations ON in production (the default in hosted projects).
enable_confirmations = false
double_confirm_changes = true
otp_length = 6
otp_expiry = 3600
